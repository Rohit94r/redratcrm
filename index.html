<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus CRM — Real Estate CRM</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    // Restore theme preference before first paint
    (function() {
      var t = localStorage.getItem('nexus-theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
      var r = localStorage.getItem('nexus-rail');
      if (r === 'true') document.documentElement.classList.add('is-rail');
      document.documentElement.classList.add('js');
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
