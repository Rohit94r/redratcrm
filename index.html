      d.classList.add('js');
      var rec = /[?&]record\b/.test(location.search);
      if (rec) d.classList.add('is-record');
      try {
        if (!rec) {
          var t = JSON.parse(localStorage.getItem('selvar:theme') || '"light"');
          d.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
          if (localStorage.getItem('selvar:rail') === '1') d.classList.add('is-rail');
        }
      } catch (e) {}
      /* 761–1279px: the sidebar is an icon rail automatically */
      var nq = matchMedia('(max-width: 1279px) and (min-width: 761px)');
